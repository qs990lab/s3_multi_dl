<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 220px; padding: 12px; font-family: sans-serif; font-size: 13px; }
    .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .switch { position: relative; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #ccc; border-radius: 22px; cursor: pointer; transition: 0.3s; }
    .slider::before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
    input:checked + .slider { background: #3F8624; }
    input:checked + .slider::before { transform: translateX(18px); }
    h3 { margin: 0 0 10px; font-size: 14px; }
  </style>
</head>
<body>
  <h3>S3 Multi DL 設定</h3>
  <div class="row">
    <span>フォルダ再帰DL</span>
    <label class="switch">
      <input type="checkbox" id="recursiveDownload">
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
